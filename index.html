<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Park Vehicle</title>
<style>
:root{--t:#0f766e;--t2:#0d9488;--g:#22c55e;--ink:#12302e;--mut:#5b7370;--bg:#eef7f5;--card:#fff;--line:#d7e8e4;--free:#16a34a;--occ:#dc2626;--res:#f59e0b;--grad:linear-gradient(135deg,#0d9488,#22c55e)}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2,h3{margin:0 0 .5rem;line-height:1.2}p{margin:.25rem 0}
header{background:var(--grad);color:#fff;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.25rem;cursor:pointer;background:none;border:0;color:#fff;padding:0}
.sp{flex:1}main{max-width:1150px;margin:0 auto;padding:1.2rem}
.card{background:var(--card);border-radius:16px;box-shadow:0 4px 18px rgba(15,118,110,.1);padding:1.2rem;margin-bottom:1rem}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:.6rem 1.1rem;background:var(--grad);color:#fff;font-weight:600}
button.sec{background:#e3f3ef;color:var(--t)}button.ghost{background:rgba(255,255,255,.2);color:#fff}button.danger{background:#fee2e2;color:#b91c1c}button.sm{padding:.3rem .7rem;font-size:.85rem}button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
label{display:block;font-weight:600;font-size:.9rem;margin:.6rem 0 .2rem}
input,select,textarea{font:inherit;width:100%;padding:.55rem .7rem;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.stat b{display:block;font-size:1.7rem;color:var(--t)}.stat span{color:var(--mut);font-size:.9rem}
.opt{cursor:pointer;text-align:left;background:var(--card);color:var(--ink);box-shadow:0 4px 18px rgba(15,118,110,.12);border-radius:16px;padding:1.4rem;border:2px solid transparent}
.opt:hover{border-color:var(--t2)}.opt .ic{font-size:2rem}.opt small{display:block;color:var(--mut);font-weight:400}
.lvl{margin:.6rem 0 .3rem;font-weight:700;color:var(--t)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:.5rem}
.slot{padding:.5rem .2rem;border-radius:10px;font-size:.85rem;text-align:center;color:#fff;border:3px solid transparent}
.slot small{display:block;font-weight:400;font-size:.7rem;opacity:.9}
.slot.free{background:var(--free)}.slot.occupied{background:var(--occ);cursor:not-allowed}.slot.reserved{background:var(--res);color:#3b2a00;cursor:not-allowed}.slot.dim{opacity:.25}.slot.sel{border-color:#12302e;box-shadow:0 0 0 3px #bbf7d0}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.85rem;margin:.4rem 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:.3rem}
.badge{display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.78rem;font-weight:700}
.b-Paid,.b-Active,.b-Completed{background:#dcfce7;color:#166534}.b-Pending,.b-Upcoming{background:#fef3c7;color:#92400e}.b-Unpaid,.b-Cancelled{background:#fee2e2;color:#991b1b}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}.tabs button{background:#fff;color:var(--t)}.tabs button.on{background:var(--grad);color:#fff}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{padding:.5rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut)}
.demo{background:#fffbeb;border:1px dashed var(--res);border-radius:10px;padding:.5rem .8rem;font-size:.85rem;margin:.6rem 0}
.ok{background:#dcfce7;color:#166534;border-radius:14px;padding:1.2rem;text-align:center}.ok h2{font-size:1.6rem}
.err{color:#b91c1c;font-size:.88rem;min-height:1.2em}.empty{text-align:center;color:var(--mut);padding:1.5rem}
.filters{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:.6rem}.filters label{margin:0 0 .1rem}
.hero{background:var(--grad);color:#fff;border-radius:20px;padding:2rem}.hero h1{font-size:clamp(1.6rem,4vw,2.4rem)}
.hero .card{color:var(--ink);max-width:420px}
.qr{width:140px;height:140px;margin:.5rem auto;border:6px solid #fff;outline:2px solid var(--line);background:repeating-conic-gradient(#12302e 0 25%,#fff 0 50%) 0 0/28px 28px}
.bar{fill:url(#gr)}.stars label{display:inline;font-size:1.5rem;cursor:pointer;margin:0}.stars input{width:auto}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);padding:.7rem 1.2rem;border-radius:10px;color:#fff;z-index:20;display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:15;padding:1rem}#modal .card{max-width:480px;width:100%;max-height:90vh;overflow:auto}
.spin{display:inline-block;width:16px;height:16px;border:3px solid #fff;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:middle}@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header><button class="brand" data-act="home" aria-label="Park Vehicle home"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#fff"/><path d="M12 25V9h7a5 5 0 010 10h-7" stroke="#0d9488" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>Park Vehicle</button><span class="sp"></span><span id="hinfo"></span><span id="hbtn"></span></header>
<main id="app"></main>
<div id="toast" role="status"></div><div id="modal"></div>
<script>
'use strict';
/* ===== Demo-only notice: admin password and OTP below are client-side and NOT secure. ===== */
const ADMIN_PW='Likhitha@123';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('Storage unavailable: data will not persist','err')}}};
const HR=3600000,DAY=86400000;
const fmt=t=>new Date(t).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
const inr=n=>'₹'+n;
function toast(m,k){const t=$('#toast');t.textContent=m;t.style.background=k==='err'?'#b91c1c':'#15803d';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3000)}

/* ===== Configuration & data ===== */
const CFG=LS.get('pv_cfg',{rates:{Car:40,Bike:20},cash:true});
const SLOTS=[];
for(let i=1;i<=12;i++)SLOTS.push({id:'A'+i,level:'A',type:'Car',res:i>=11});
for(let i=1;i<=12;i++)SLOTS.push({id:'B'+i,level:'B',type:'Bike',res:i===12});
const saveCfg=()=>LS.set('pv_cfg',CFG);
function seed(){const n=Date.now(),mk=(id,reg,type,slot,st,h,pay,paidAgo,method)=>({id,reg,type,slot,start:st,hrs:h,amount:CFG.rates[type]*h,method,pay,paidAt:pay==='Paid'?n-paidAgo*DAY:null,cancelled:false,phone:'SAMPLE',sample:true,created:n-9*DAY});
return[mk('PV-SAMPLE1','TN58AB1234','Car','A1',n-HR,3,'Paid',0,'UPI'),mk('PV-SAMPLE2','TN59CD5678','Car','A2',n+2*HR,2,'Pending',0,'Cash'),mk('PV-SAMPLE3','TN58EF9012','Bike','B1',n-2*HR,4,'Paid',0,'UPI'),mk('PV-SAMPLE4','TN64GH3456','Car','A3',n-2*DAY,5,'Paid',2,'UPI'),mk('PV-SAMPLE5','TN58JK7788','Bike','B2',n-3*DAY,6,'Paid',3,'Cash'),mk('PV-SAMPLE6','TN67LM2211','Car','A4',n-4*DAY,8,'Paid',4,'UPI'),mk('PV-SAMPLE7','TN58NP4455','Bike','B3',n-5*DAY,3,'Paid',5,'UPI'),mk('PV-SAMPLE8','TN60QR6677','Car','A5',n-6*DAY,4,'Paid',6,'Cash')]}
let B=LS.get('pv_b',null);if(!Array.isArray(B)){B=seed();LS.set('pv_b',B)}
let FB=LS.get('pv_f',[]);
const saveB=()=>LS.set('pv_b',B);
function cleanup(){let c=false;B.forEach(b=>{if(b.pay==='Unpaid'&&!b.cancelled&&Date.now()-b.created>15*60000){b.cancelled=true;c=true}});if(c)saveB()}
const end=b=>b.start+b.hrs*HR;
function bstatus(b){const n=Date.now();return b.cancelled?'Cancelled':n>=end(b)?'Completed':n>=b.start?'Active':'Upcoming'}
function slotState(s,from=Date.now(),to=Date.now()+1){if(s.res)return'reserved';return B.some(b=>b.slot===s.id&&!b.cancelled&&b.start<to&&end(b)>from)?'occupied':'free'}
const rate=t=>CFG.rates[t];
const newId=()=>'PV-'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();
const normReg=r=>r.toUpperCase().replace(/[\s-]/g,'');
const revenue=()=>B.filter(b=>b.pay==='Paid');
const sumAmt=a=>a.reduce((s,b)=>s+b.amount,0);

/* ===== State ===== */
const S={view:'home',user:LS.get('pv_user',null),admin:LS.get('pv_admin',false)===true,otp:null,phone:'',form:null,payId:null,tab:'ov',f:{q:'',type:'',level:'',status:''},lf:{type:'',level:'',status:''},fb:null,done:null,busy:false};
function resetForm(){const d=new Date(Date.now()+HR);d.setMinutes(0,0,0);const p=n=>String(n).padStart(2,'0');S.form={reg:'',type:'Car',date:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,time:`${p(d.getHours())}:00`,hrs:2,slot:''}}
resetForm();
function go(v){S.view=v;render();window.scrollTo(0,0)}

/* ===== Shared UI builders ===== */
function slotGrid(o){let h='';for(const lv of['A','B']){const arr=SLOTS.filter(s=>s.level===lv&&(!o.level||o.level===lv)&&(!o.type||s.type===o.type));if(!arr.length)continue;
h+=`<div class="lvl">Level ${lv} · ${lv==='A'?'Cars':'Bikes'}</div><div class="slots">`+arr.map(s=>{const st=slotState(s,o.from,o.to);const dim=(o.status&&o.status!==st)||(o.q&&!matchQ(s,o.q));const comp=!o.vt||o.vt===s.type;
return`<button class="slot ${st}${dim?' dim':''}${o.sel===s.id?' sel':''}" data-act="slot" data-slot="${s.id}" ${o.sel===s.id?'aria-pressed="true"':''} aria-label="Slot ${s.id}, ${s.type}, ${st}${comp?'':', not compatible'}">${s.id}<small>${s.type}</small></button>`}).join('')+'</div>'}
return h+`<div class="legend"><span><i style="background:var(--free)"></i>Available</span><span><i style="background:var(--occ)"></i>Occupied</span><span><i style="background:var(--res)"></i>Reserved</span></div>`}
function matchQ(s,q){q=q.toUpperCase();return s.id.includes(q)||B.some(b=>b.slot===s.id&&!b.cancelled&&bstatus(b)==='Active'&&b.reg.includes(q))}
function filterBar(F,key,withQ){const sel=(n,l,opts)=>`<div><label for="${key}${n}">${l}</label><select id="${key}${n}" data-f="${key}" data-k="${n}">${opts.map(([v,t])=>`<option value="${v}"${F[n]===v?' selected':''}>${t}</option>`).join('')}</select></div>`;
return`<div class="filters">${withQ?`<div><label for="${key}q">Search reg. number or slot</label><input id="${key}q" data-f="${key}" data-k="q" value="${esc(F.q)}" placeholder="e.g. TN58 or A3"></div>`:''}${sel('type','Vehicle type',[['','All'],['Car','Car'],['Bike','Bike']])}${sel('level','Level',[['','All'],['A','Level A'],['B','Level B']])}${sel('status','Slot status',[['','All'],['free','Available'],['occupied','Occupied'],['reserved','Reserved']])}</div>`}
const badge=t=>`<span class="badge b-${esc(t)}">${esc(t)}</span>`;
const empty=(t,a)=>`<div class="empty">${t}${a||''}</div>`;

/* ===== Views ===== */
function vHome(){const free=SLOTS.filter(s=>slotState(s)==='free').length;
return`<section class="hero grid g2"><div><h1>Find a spot. Book it. Park easy.</h1><p>Reserve a car or bike slot in seconds and pay by UPI or cash at the desk.</p><p><b>${free}</b> of ${SLOTS.length} slots are free right now.</p></div>
<div class="card"><h2>Log in with your mobile number</h2><form data-form="phone" novalidate><label for="ph">Mobile number</label><input id="ph" inputmode="numeric" maxlength="10" placeholder="10-digit number" value="${esc(S.phone)}" autocomplete="tel"><div class="err" id="e"></div><button>Send OTP (demo)</button></form></div></section>
<div class="card" style="margin-top:1rem"><h2>Live parking layout</h2>${slotGrid({})}</div>`}
function vOtp(){return`<div class="card" style="max-width:440px;margin:auto"><h2>Verify your number</h2><p>Code for +91 ${esc(S.phone)}</p><div class="demo"><b>Demo OTP:</b> no SMS is sent. Your code is <b>${esc(S.otp.code)}</b>. Replace <code>sendOtp()</code> / <code>verifyOtp()</code> with a real SMS service later.</div>
<form data-form="otp" novalidate><label for="otp">6-digit OTP</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><div class="err" id="e"></div><button>Verify OTP</button> <button type="button" class="sec" data-act="resend">Resend OTP</button> <button type="button" class="sec" data-act="home">Change number</button></form></div>`}
function vDash(){const mine=B.filter(b=>b.phone===S.user);return`<h2>Welcome, +91 ${esc(S.user)}</h2><div class="grid g3">
<button class="opt" data-act="book"><span class="ic">🅿️</span><h3>Book a New Slot</h3><small>Choose a slot, duration and pay</small></button>
<button class="opt" data-act="mine"><span class="ic">🧾</span><h3>View Your Booked Slots</h3><small>${mine.length} booking(s) so far</small></button>
<button class="opt" data-act="layout"><span class="ic">🗺️</span><h3>View Parking Layout</h3><small>See what is free right now</small></button></div>`}
function calc(f){const hrs=Math.max(1,Math.ceil(+f.hrs||0));return{hrs,rate:rate(f.type),amt:hrs*rate(f.type)}}
function interval(f){const s=new Date(f.date+'T'+f.time).getTime();return[s,s+calc(f).hrs*HR]}
function bookSummary(){const f=S.form,c=calc(f),[s,e]=interval(f);return`<h3>Booking summary</h3><table><tr><th>Vehicle</th><td>${esc(f.reg||'—')} (${f.type})</td></tr><tr><th>Slot</th><td>${esc(f.slot||'Select a slot')}</td></tr><tr><th>From</th><td>${isNaN(s)?'—':fmt(s)}</td></tr><tr><th>Until</th><td>${isNaN(e)?'—':fmt(e)}</td></tr><tr><th>Rate</th><td>${inr(c.rate)} per hour</td></tr><tr><th>Duration</th><td>${c.hrs} hour(s)</td></tr><tr><th>Total</th><td><b>${inr(c.amt)}</b></td></tr></table><p class="demo">Billing rule: hourly rate × duration, rounded up to a full hour, minimum 1 hour.</p><div class="err" id="e"></div><button data-act="pay" ${f.slot?'':'disabled'}>Proceed to Pay ${inr(c.amt)}</button>`}
function bookGrid(){const[s,e]=interval(S.form);return slotGrid({vt:S.form.type,type:S.form.type,from:isNaN(s)?undefined:s,to:isNaN(e)?undefined:e,sel:S.form.slot})}
function vBook(){const f=S.form;return`<h2>Book a new slot</h2><div class="grid g2"><div class="card" id="bform"><label for="reg">Vehicle registration number</label><input id="reg" data-b="reg" value="${esc(f.reg)}" placeholder="TN58AB1234" autocapitalize="characters">
<label for="type">Vehicle type</label><select id="type" data-b="type"><option${f.type==='Car'?' selected':''}>Car</option><option${f.type==='Bike'?' selected':''}>Bike</option></select>
<label for="date">Booking date</label><input id="date" type="date" data-b="date" value="${f.date}"><label for="time">Start time</label><input id="time" type="time" data-b="time" value="${f.time}">
<label for="hrs">Duration (hours)</label><input id="hrs" type="number" min="1" max="24" data-b="hrs" value="${f.hrs}"><p class="demo">Showing ${f.type} slots for your chosen time. Pick one below.</p><div id="bgrid">${bookGrid()}</div></div><div class="card" id="bsum">${bookSummary()}</div></div>`}
function vPay(){const b=B.find(x=>x.id===S.payId);if(!b)return empty('No booking to pay for.');
if(S.done===b.id)return`<div class="ok"><h2>✓ Slot Booked Successfully!</h2><p>Booking ID: <b>${esc(b.id)}</b></p><p>Slot ${esc(b.slot)} · ${esc(b.reg)} (${b.type})</p><p>Payment: ${badge(b.pay)} ${b.pay==='Pending'?'— awaiting admin confirmation of cash payment':''}</p><p><button data-act="mine">View your bookings</button></p></div>`;
return`<h2>Payment</h2><div class="grid g2"><div class="card"><h3>Booking ${esc(b.id)}</h3><table><tr><th>Vehicle</th><td>${esc(b.reg)}</td></tr><tr><th>Slot</th><td>${esc(b.slot)}</td></tr><tr><th>Start</th><td>${fmt(b.start)}</td></tr><tr><th>Duration</th><td>${b.hrs} hour(s)</td></tr><tr><th>Amount payable</th><td><b>${inr(b.amount)}</b></td></tr><tr><th>Status</th><td>${badge(b.pay)}</td></tr></table><p class="err" id="e"></p><button class="danger" data-act="cancelpay">Cancel booking</button></div>
<div class="card"><h3>Pay by UPI</h3><div class="demo">Demo payment: no real money moves. A real gateway is needed for live payments.</div><div class="qr" role="img" aria-label="QR placeholder"></div><p style="text-align:center">UPI ID: <b>parkvehicle@demo</b></p><button data-act="upi" ${S.busy?'disabled':''}>${S.busy?'<span class="spin"></span> Processing…':'Pay Now '+inr(b.amount)}</button>
${CFG.cash?`<hr><h3>Pay by cash</h3><p>Pay at the desk; your booking stays pending until the admin marks it paid.</p><button class="sec" data-act="cash">Choose cash payment</button>`:'<p class="demo">Cash payment is currently disabled by the admin.</p>'}</div></div>`}
function vMine(){const mine=B.filter(b=>b.phone===S.user).sort((a,b)=>b.start-a.start);
const grp=(t,l)=>{const a=mine.filter(b=>bstatus(b)===t);return a.length?`<h3>${l}</h3><div class="grid g2">${a.map(card).join('')}</div>`:''};
function card(b){const st=bstatus(b),fb=FB.find(x=>x.bid===b.id);return`<div class="card"><b>${esc(b.id)}</b> ${badge(st)} ${badge(b.pay)}<p>${esc(b.reg)} · ${b.type}</p><p>Slot ${esc(b.slot)} · Level ${esc(b.slot[0])}</p><p>${fmt(b.start)} · ${b.hrs} hr</p><p><b>${inr(b.amount)}</b> · ${esc(b.method||'—')}</p><p><button class="sec sm" data-act="detail" data-id="${esc(b.id)}">Details</button> ${b.pay==='Unpaid'&&!b.cancelled?`<button class="sm" data-act="resume" data-id="${esc(b.id)}">Pay now</button>`:''}${(st==='Upcoming')?` <button class="danger sm" data-act="cancel" data-id="${esc(b.id)}">Cancel</button>`:''}</p>
${st==='Completed'?(fb?`<p>Your feedback: ${'★'.repeat(fb.rating)}${'☆'.repeat(5-fb.rating)} ${esc(fb.comment)}</p>`:S.fb===b.id?`<form data-form="fb" data-id="${esc(b.id)}"><div class="stars" role="radiogroup" aria-label="Rating">${[1,2,3,4,5].map(i=>`<label><input type="radio" name="r" value="${i}" ${i===5?'checked':''}>${i}★</label>`).join(' ')}</div><label for="cm">Comment</label><textarea id="cm" rows="2" maxlength="300"></textarea><button class="sm">Save feedback</button></form>`:`<button class="sm" data-act="fb" data-id="${esc(b.id)}">Give feedback</button>`):''}</div>`}
return`<h2>Your booked slots</h2>${mine.length?grp('Active','Active')+grp('Upcoming','Upcoming')+grp('Completed','Completed')+grp('Cancelled','Cancelled'):`<div class="card">${empty('You have no bookings yet.','<p><button data-act="book">Book a new slot</button></p>')}</div>`}`}
function vLayout(){return`<h2>Parking layout</h2><div class="card">${filterBar(S.lf,'lf',false)}<div id="lgrid">${slotGrid(S.lf)}</div></div>`}
function hist(){const a=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*DAY);d.setHours(0,0,0,0);const t=d.getTime();a.push({l:d.toLocaleDateString('en-IN',{weekday:'short'}),v:sumAmt(revenue().filter(b=>b.paidAt>=t&&b.paidAt<t+DAY))})}return a}
function chart(){const d=hist(),m=Math.max(1,...d.map(x=>x.v));return`<svg viewBox="0 0 420 200" width="100%" role="img" aria-label="Weekly revenue chart"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#0d9488"/></linearGradient></defs>${d.map((x,i)=>{const h=x.v/m*130;return`<rect class="bar" x="${i*58+14}" y="${160-h}" width="38" height="${h}" rx="6"/><text x="${i*58+33}" y="${154-h}" font-size="10" text-anchor="middle" fill="#12302e">${inr(x.v)}</text><text x="${i*58+33}" y="182" font-size="11" text-anchor="middle" fill="#5b7370">${x.l}</text>`}).join('')}</svg>`}
function vAdmin(){const T=[['ov','Overview'],['bk','Bookings & payments'],['ly','Parking layout'],['fb','Feedback']];
let body='';const now=Date.now(),occ=SLOTS.filter(s=>slotState(s)==='occupied').length,res=SLOTS.filter(s=>s.res).length,free=SLOTS.length-occ-res,t0=new Date().setHours(0,0,0,0),P=revenue();
if(S.tab==='ov')body=`<div class="grid g4">${[['Total slots',SLOTS.length],['Occupied now',occ],['Free now',free],['Utilization',Math.round(occ/(SLOTS.length-res)*100)+'%'],['Today\'s revenue',inr(sumAmt(P.filter(b=>b.paidAt>=t0)))],['Total revenue',inr(sumAmt(P))],['Pending payments',B.filter(b=>b.pay==='Pending'&&!b.cancelled).length],['Reserved slots',res]].map(([l,v])=>`<div class="card stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
<div class="grid g2"><div class="card"><h3>Weekly revenue (paid only)</h3>${chart()}</div><div class="card"><h3>Settings</h3><label><input type="checkbox" style="width:auto" data-act="cashtoggle" ${CFG.cash?'checked':''}> Allow cash payments</label><label for="rc">Car rate (₹/hour)</label><input id="rc" type="number" min="1" data-rate="Car" value="${CFG.rates.Car}"><label for="rb">Bike rate (₹/hour)</label><input id="rb" type="number" min="1" data-rate="Bike" value="${CFG.rates.Bike}"><p class="demo">Rows with IDs starting PV-SAMPLE are sample data.</p><button class="danger sm" data-act="reset">Reset all demo data</button></div></div>`;
if(S.tab==='bk'){const q=S.f.q.toUpperCase(),rows=[...B].sort((a,b)=>b.created-a.created).filter(b=>(!S.f.type||b.type===S.f.type)&&(!S.f.level||b.slot[0]===S.f.level)&&(!q||b.reg.includes(q)||b.slot.includes(q)));
body=`<div class="card">${filterBar(S.f,'af',true)}<div class="tw" id="atable">${tbl(rows)}</div></div>`}
if(S.tab==='ly')body=`<div class="card">${filterBar(S.f,'af',true)}<div id="agrid">${slotGrid(S.f)}</div></div>`;
if(S.tab==='fb')body=`<div class="card"><h3>Customer feedback</h3>${FB.length?FB.map(x=>`<p><b>${esc(x.reg)}</b> · ${esc(x.bid)} · ${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}<br>${esc(x.comment)||'<i>No comment</i>'}</p>`).join(''):empty('No feedback yet.')}</div>`;
return`<h2>Admin dashboard</h2><div class="tabs" role="tablist">${T.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-t="${k}">${l}</button>`).join('')}</div>${body}`}
function tbl(rows){if(!rows.length)return empty('No bookings match.');return`<table><tr><th>ID</th><th>Vehicle</th><th>Type</th><th>Slot</th><th>Booked from</th><th>Duration</th><th>Amount</th><th>Payment</th><th>Status</th><th></th></tr>${rows.map(b=>`<tr><td>${esc(b.id)}</td><td>${esc(b.reg)}</td><td>${b.type}</td><td>${esc(b.slot)}</td><td>${fmt(b.start)}</td><td>${b.hrs} hr</td><td>${inr(b.amount)}</td><td>${badge(b.pay)} ${esc(b.method||'')}</td><td>${badge(bstatus(b))}</td><td><button class="sec sm" data-act="detail" data-id="${esc(b.id)}">Details</button>${b.pay==='Pending'&&!b.cancelled?` <button class="sm" data-act="markpaid" data-id="${esc(b.id)}">Mark as Paid</button>`:''}</td></tr>`).join('')}</table>`}
function vAdminLogin(){return`<div class="card" style="max-width:400px;margin:auto"><h2>Admin login</h2><div class="demo">Demo only: a password in client-side code is not secure.</div><form data-form="admin" novalidate><label for="pw">Password</label><input id="pw" type="password" autocomplete="off"><div class="err" id="e"></div><button>Log in</button></form></div>`}

/* ===== Render ===== */
function render(){cleanup();const v=S.view;let h='';
$('#hinfo').textContent=S.user?'+91 '+S.user:S.admin?'Admin':'';
$('#hbtn').innerHTML=S.user||S.admin?'<button class="ghost sm" data-act="logout">Log out</button>':'<button class="ghost sm" data-act="adminlogin">Admin Login</button>';
if(v==='home')h=vHome();else if(v==='otp')h=vOtp();else if(v==='adminlogin')h=vAdminLogin();else if(v==='admin')h=S.admin?vAdmin():vAdminLogin();
else if(!S.user){h=vHome()}else{h=(v==='dash'?'':'<p><button class="sec sm" data-act="dash">← Dashboard</button></p>')+(v==='dash'?vDash():v==='book'?vBook():v==='pay'?vPay():v==='mine'?vMine():v==='layout'?vLayout():vDash())}
$('#app').innerHTML=h}

/* ===== Auth (demo) ===== */
function sendOtp(phone){S.phone=phone;S.otp={code:String(Math.floor(100000+Math.random()*900000)),at:Date.now()}} /* swap for real SMS API */
function verifyOtp(c){return S.otp&&c===S.otp.code&&Date.now()-S.otp.at<5*60000} /* swap for real verification */

/* ===== Actions ===== */
function modal(h){const m=$('#modal');m.innerHTML=`<div class="card" role="dialog" aria-modal="true">${h}<p><button data-act="close">Close</button></p></div>`;m.style.display='flex'}
function detailHtml(b){const fb=FB.find(x=>x.bid===b.id);return`<h3>${esc(b.id)}${b.sample?' (sample)':''}</h3><table><tr><th>Vehicle</th><td>${esc(b.reg)} (${b.type})</td></tr><tr><th>Slot</th><td>${esc(b.slot)}, Level ${esc(b.slot[0])}</td></tr><tr><th>From</th><td>${fmt(b.start)}</td></tr><tr><th>Until</th><td>${fmt(end(b))}</td></tr><tr><th>Amount</th><td>${inr(b.amount)}</td></tr><tr><th>Method</th><td>${esc(b.method||'—')}</td></tr><tr><th>Payment</th><td>${badge(b.pay)}${b.paidAt?' on '+fmt(b.paidAt):''}</td></tr><tr><th>Status</th><td>${badge(bstatus(b))}</td></tr><tr><th>Feedback</th><td>${fb?'★'.repeat(fb.rating)+' '+esc(fb.comment):'—'}</td></tr></table>`}
function updBook(){$('#bgrid').innerHTML=bookGrid();$('#bsum').innerHTML=bookSummary()}
const A={
home(){S.otp=null;go(S.user?'dash':'home')},dash(){go('dash')},adminlogin(){go('admin')},close(){$('#modal').style.display='none'},
logout(){if(!confirm('Log out?'))return;S.user=null;S.admin=false;LS.set('pv_user',null);LS.set('pv_admin',false);go('home')},
book(){resetForm();go('book')},mine(){S.fb=null;go('mine')},layout(){go('layout')},
resend(){sendOtp(S.phone);render();toast('New demo OTP generated')},
slot(el){const s=SLOTS.find(x=>x.id===el.dataset.slot);if(!s)return;const st=slotState(s,...(S.view==='book'?interval(S.form):[Date.now(),Date.now()+1]));
if(S.view==='book'){if(s.type!==S.form.type)return toast('That slot is for '+s.type+'s only','err');if(st!=='free')return toast('Slot '+s.id+' is '+st,'err');S.form.slot=s.id;updBook();return}
const free=st==='free';modal(`<h3>Slot ${s.id}</h3><p>Level ${s.level} · ${s.type}</p><p>Status: <b>${st==='free'?'Available':st==='occupied'?'Occupied':'Reserved'}</b></p><p>Estimated charge: ${inr(rate(s.type))} per hour</p>${free&&S.user?`<button data-act="pick" data-slot="${s.id}">Book this slot</button>`:free?'<p>Log in to book this slot.</p>':''}`)},
pick(el){const s=SLOTS.find(x=>x.id===el.dataset.slot);resetForm();S.form.type=s.type;S.form.slot=s.id;A.close();go('book')},
pay(){const f=S.form,e=$('#e'),reg=normReg(f.reg),[s,en]=interval(f),c=calc(f);
const bad=!/^[A-Z]{2}\d{1,2}[A-Z]{0,3}\d{4}$/.test(reg)?'Enter a valid registration number, e.g. TN58AB1234.':isNaN(s)?'Choose a valid date and start time.':s<Date.now()-10*60000?'Start time cannot be in the past.':!(+f.hrs>=1&&+f.hrs<=24)?'Duration must be 1 to 24 hours.':!f.slot?'Select a slot.':B.some(b=>b.reg===reg&&!b.cancelled&&b.start<en&&end(b)>s)?'This vehicle already has a booking that overlaps this time.':slotState(SLOTS.find(x=>x.id===f.slot),s,en)!=='free'?'That slot was just taken. Choose another.':'';
if(bad){e.textContent=bad;return}
const b={id:newId(),reg,type:f.type,slot:f.slot,start:s,hrs:c.hrs,amount:c.amt,method:null,pay:'Unpaid',paidAt:null,cancelled:false,phone:S.user,sample:false,created:Date.now()};B.push(b);saveB();S.payId=b.id;S.done=null;go('pay')},
resume(el){S.payId=el.dataset.id;S.done=null;go('pay')},
upi(){const b=B.find(x=>x.id===S.payId);S.busy=true;render();setTimeout(()=>{S.busy=false;b.pay='Paid';b.method='UPI (demo)';b.paidAt=Date.now();saveB();S.done=b.id;render()},1200)},
cash(){const b=B.find(x=>x.id===S.payId);if(!CFG.cash)return;b.pay='Pending';b.method='Cash';saveB();S.done=b.id;render()},
cancelpay(){if(!confirm('Cancel this booking?'))return;const b=B.find(x=>x.id===S.payId);b.cancelled=true;saveB();toast('Booking cancelled');go('dash')},
cancel(el){if(!confirm('Cancel this upcoming booking? Paid amounts are not refunded in this demo.'))return;const b=B.find(x=>x.id===el.dataset.id);b.cancelled=true;saveB();render()},
detail(el){const b=B.find(x=>x.id===el.dataset.id);if(b)modal(detailHtml(b))},
fb(el){S.fb=el.dataset.id;render()},
tab(el){S.tab=el.dataset.t;render()},
markpaid(el){if(!confirm('Confirm that cash has been received?'))return;const b=B.find(x=>x.id===el.dataset.id);b.pay='Paid';b.paidAt=Date.now();saveB();render();toast('Marked as paid. Revenue updated.')},
cashtoggle(el){CFG.cash=el.checked;saveCfg()},
reset(){if(!confirm('Delete all bookings and feedback and restore sample data?'))return;B=seed();FB=[];saveB();LS.set('pv_f',FB);render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;const f=A[el.dataset.act];if(f)f(el)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.act==='cashtoggle')A.cashtoggle(el);
if(el.dataset.rate){const v=Math.floor(+el.value);if(v>=1){CFG.rates[el.dataset.rate]=v;saveCfg();toast('Rate updated')}else{el.value=CFG.rates[el.dataset.rate];toast('Rate must be at least ₹1','err')}}});
document.addEventListener('input',e=>{const el=e.target;
if(el.dataset.b){S.form[el.dataset.b]=el.value;if(el.dataset.b==='type')S.form.slot='';if(S.form.slot&&slotState(SLOTS.find(x=>x.id===S.form.slot),...interval(S.form))!=='free')S.form.slot='';updBook()}
if(el.dataset.f){const key=el.dataset.f,F=key==='lf'?S.lf:S.f;F[el.dataset.k]=el.value;if(key==='lf')$('#lgrid').innerHTML=slotGrid(S.lf);else{if(S.tab==='ly')$('#agrid').innerHTML=slotGrid(S.f);else render2()}}});
function render2(){const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;render();const n=id&&document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch{}}}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.form,err=$('#e');
if(k==='phone'){const p=$('#ph').value.trim();if(!/^[6-9]\d{9}$/.test(p)){err.textContent='Enter a valid 10-digit mobile number.';return}sendOtp(p);go('otp')}
if(k==='otp'){if(!verifyOtp($('#otp').value.trim())){err.textContent='Incorrect or expired OTP. Check the demo code above.';return}S.user=S.phone;S.otp=null;LS.set('pv_user',S.user);toast('Logged in');go('dash')}
if(k==='admin'){if($('#pw').value!==ADMIN_PW){err.textContent='Incorrect password.';return}S.admin=true;LS.set('pv_admin',true);go('admin')}
if(k==='fb'){const r=+(f.querySelector('input[name=r]:checked')||{}).value,b=B.find(x=>x.id===f.dataset.id);if(!(r>=1&&r<=5)||!b)return toast('Choose a rating','err');FB.push({bid:b.id,reg:b.reg,rating:r,comment:f.querySelector('textarea').value.trim().slice(0,300),at:Date.now()});LS.set('pv_f',FB);S.fb=null;render();toast('Thanks for your feedback')}});
window.addEventListener('storage',()=>{try{B=LS.get('pv_b',B);FB=LS.get('pv_f',FB);if(!['otp','pay'].includes(S.view)&&!document.activeElement.matches('input,textarea,select'))render()}catch{}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')A.close()});
if(S.user)S.view='dash';else if(S.admin&&location.hash==='#admin')S.view='admin';
render();
</script>
